
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            color: #333;
        }

        header {
            background-color: #2563eb;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #1e40af;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        main {
            text-align: center;
            padding: 60px 20px;
        }

        h2 {
            color: #2563eb;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #1e40af;
        }

        footer {
            background-color: #1f2937;
            color: white;
            text-align: center;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>Learning HTML, CSS and JavaScript</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <main id="home">
        <h2>Hello, World!</h2>
        <p>This is my first sample HTML webpage.</p>
        <p> This is test for change </p>p
        <p>You can customize it according to your needs.</p>

        <button onclick="showMessage()">Click Me</button>

        <p id="message"></p>
    </main>

    <footer>
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>

    <script>
        function showMessage() {
            document.getElementById("message").textContent =
                "Hello! Your JavaScript is working.";
        }
    </script>

</body>
</html>
